[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-merge-local"
dynamic = ["version"]  # single source of truth: memory_merge/__init__.py
description = "Local-first, single-user memory for AI agents: SQLite source of truth, Markdown mirror, MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stark-work-1001" }]
keywords = ["mcp", "memory", "agents", "sqlite", "fts5", "rag", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4"]                      # PDF import
local = ["sentence-transformers>=3.0"]  # in-process embeddings (reference implementation)
gguf = ["llama-cpp-python>=0.3"]        # in-process GGUF embeddings / judge
# The compiled vector kernel is built from ./native (pip install ./native); it is not on PyPI.

[project.urls]
Homepage = "https://github.com/Stark-work-1001/memory-merge"
Issues = "https://github.com/Stark-work-1001/memory-merge/issues"
Changelog = "https://github.com/Stark-work-1001/memory-merge/blob/main/CHANGELOG.md"

[project.scripts]
memory-merge = "memory_merge.__main__:main"
memory-merge-mcp = "memory_merge.server:main"

[tool.setuptools.dynamic]
version = { attr = "memory_merge.__version__" }

[tool.setuptools.packages.find]
include = ["memory_merge*"]

[tool.setuptools.package-data]
memory_merge = ["static/*.html", "static/*.js", "static/*.css"]
