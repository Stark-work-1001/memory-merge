[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-merge-local"
version = "0.1.0a1"
description = "Local single-user Markdown SQLite MCP memory prototype"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
memory-merge = "memory_merge.__main__:main"

[tool.setuptools.packages.find]
include = ["memory_merge*"]

[tool.setuptools.package-data]
memory_merge = ["static/*.html", "static/*.js", "static/*.css"]
