name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste memory contents, API keys or personal data. For security issues use SECURITY.md instead."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "Commands you ran and what you expected."}
    validations: {required: true}
  - type: textarea
    id: doctor
    attributes: {label: Output of `memory-merge doctor`, render: json}
  - type: input
    id: version
    attributes: {label: Version, placeholder: "memory-merge --version"}
    validations: {required: true}
